<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fabric background</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1c1001;
    --btn-bg: #1c1001;
    --btn-ink: #ffe9c7;
    --fallback: linear-gradient(135deg, #ff9f0a, #ff9500 55%, #c96a00);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ink: #1c1001; --btn-bg: #1c1001; --btn-ink: #ffe9c7; --fallback: linear-gradient(135deg, #ff9f0a, #ff9500 55%, #a85600); }
  }
  :root[data-theme="dark"] { --ink: #1c1001; --btn-bg: #1c1001; --btn-ink: #ffe9c7; --fallback: linear-gradient(135deg, #ff9f0a, #ff9500 55%, #a85600); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100%;
    background: #ff9500; background-image: var(--fallback);
    color: var(--ink);
    font-family: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  }

  /* ---- The live background: drop this canvas + the script into any page ---- */
  #fabric { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; display: block; }
  .no-gl #fabric { display: none; }

  /* ---- Demo storefront content ---- */
  .page { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; padding: 24px clamp(20px, 5vw, 64px) 56px; }
  nav { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .brand { font-weight: 700; font-size: 1.35rem; letter-spacing: -0.02em; }
  nav ul { display: flex; gap: clamp(16px, 3vw, 36px); list-style: none; margin: 0; padding: 0; font-weight: 600; }
  a { color: inherit; text-decoration: none; }
  nav a { padding: 6px 2px; border-bottom: 2px solid transparent; }
  nav a:hover { border-bottom-color: currentColor; }
  a:focus-visible, button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; border-radius: 4px; }
  .hero { margin-top: auto; max-width: 780px; }
  h1 { font-size: clamp(2.6rem, 8vw, 6.4rem); line-height: 0.98; letter-spacing: -0.035em; margin: 0 0 20px; font-weight: 700; font-variation-settings: "opsz" 96; }
  .hero p { font-size: clamp(1.05rem, 2vw, 1.3rem); line-height: 1.45; max-width: 46ch; margin: 0 0 28px; font-weight: 400; }
  .cta { display: inline-block; background: var(--btn-bg); color: var(--btn-ink); padding: 16px 28px; border-radius: 999px; font-weight: 600; font-size: 1rem; transition: transform .2s; }
  .cta:hover { transform: translateY(-2px); }
  @media (max-width: 560px) { nav ul li:nth-child(2) { display: none; } }
</style>
</head>
<body>

<canvas id="fabric" aria-hidden="true"></canvas>

<div class="page">
  <nav>
    <a class="brand" href="#">Selvedge</a>
    <ul>
      <li><a href="#">Shop</a></li>
      <li><a href="#">Journal</a></li>
      <li><a href="#">Bag (0)</a></li>
    </ul>
  </nav>
  <header class="hero">
    <h1>Cloth you can feel from across the room.</h1>
    <p>Woven in small batches, cut by the metre, and shipped the day you order.</p>
    <a class="cta" href="#">Shop new fabrics</a>
  </header>
</div>

<script>
/* Fabric closeup background: #FF9500 / #FF9F0A, seamless loop.
   Every time-dependent term uses an integer multiple of the phase angle,
   so the animation repeats perfectly every LOOP_MS. */
(function () {
  var LOOP_MS = 14000;            // length of one seamless loop
  var MAX_DPR = 1.5;              // render-resolution cap for performance
  var canvas = document.getElementById('fabric');
  var gl = canvas.getContext('webgl2', { antialias: false, alpha: false, powerPreference: 'low-power' });
  if (!gl) { document.documentElement.classList.add('no-gl'); return; }

  var vs = '#version 300 es\nin vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
  var fs = `#version 300 es
precision highp float;
uniform vec2 uRes; uniform float uPhase;
out vec4 o;
const float PI = 3.14159265;

float H(vec2 p, float t){
  vec2 q = p;
  q += 0.35 * vec2(sin(p.y*1.3 + 1.0 + t),     cos(p.x*1.1 + 2.0 + t));
  q += 0.18 * vec2(sin(q.y*2.7 + 3.0 - 2.0*t), cos(q.x*2.3 + 2.0*t));
  float h = 0.0;
  h += 0.55 * sin(dot(q, vec2( 0.80, 0.60)) * 2.2  + t);
  h += 0.30 * sin(dot(q, vec2(-0.50, 0.87)) * 3.6  - t + 1.7);
  h += 0.16 * sin(dot(q, vec2( 0.95,-0.30)) * 6.1  + 2.0*t + 0.6);
  h += 0.07 * sin(dot(q, vec2( 0.20, 0.98)) * 11.0 - 3.0*t);
  return h;
}
float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.5453); }

void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  vec2 p  = (uv - 0.5) * vec2(uRes.x / uRes.y, 1.0) * 2.4;
  float t = uPhase;

  // folds -> surface normal
  float e  = 0.003;
  float h  = H(p, t);
  float hx = H(p + vec2(e, 0.0), t);
  float hy = H(p + vec2(0.0, e), t);
  vec3 n = normalize(vec3(-(hx - h)/e * 0.25, -(hy - h)/e * 0.25, 1.0));

  // woven threads, drifting with the slope of the cloth
  vec2 w  = (p + n.xy * 0.06) * 72.0;
  vec2 fw = fwidth(w);
  float aa = 1.0 - smoothstep(0.25, 0.7, max(fw.x, fw.y));
  float tv = sin(fract(w.x) * PI);
  float th = sin(fract(w.y) * PI);
  float over = mod(floor(w.x) + floor(w.y), 2.0);
  float weave = mix(0.7, mix(th, tv, over), aa);

  // light drifts in a small circle, which also loops
  vec3 L  = normalize(vec3(-0.45 + 0.18*cos(t), 0.55 + 0.18*sin(t), 0.75));
  vec3 Hh = normalize(L + vec3(0.0, 0.0, 1.0));
  float d     = clamp(dot(n, L) * 0.5 + 0.55, 0.0, 1.0);
  float spec  = pow(max(dot(n, Hh), 0.0), 48.0) * (0.7 + 0.3*weave);
  float sheen = pow(1.0 - n.z, 2.5);
  float ao    = 0.72 + 0.28 * smoothstep(-1.0, 1.0, h);

  vec3 cA = vec3(1.000, 0.584, 0.000);   // #FF9500
  vec3 cB = vec3(1.000, 0.624, 0.039);   // #FF9F0A
  vec3 base   = mix(cA, cB, smoothstep(-1.0, 1.0, h));
  vec3 shadow = vec3(0.60, 0.21, 0.00);
  vec3 hi     = vec3(1.00, 0.82, 0.45);

  vec3 col = mix(shadow, base, smoothstep(0.15, 0.75, d));
  col += hi * (spec * 0.55 + sheen * 0.18);
  col *= ao * (0.86 + 0.14 * weave);
  col *= 1.0 - 0.55 * dot(uv - 0.5, uv - 0.5);
  col += (hash(gl_FragCoord.xy) - 0.5) * 0.02;
  o = vec4(clamp(col, 0.0, 1.0), 1.0);
}`;

  function sh(type, src){
    var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s)); return null; }
    return s;
  }
  var v = sh(gl.VERTEX_SHADER, vs), f = sh(gl.FRAGMENT_SHADER, fs);
  if (!v || !f) { document.documentElement.classList.add('no-gl'); return; }
  var prog = gl.createProgram();
  gl.attachShader(prog, v); gl.attachShader(prog, f); gl.linkProgram(prog);
  gl.useProgram(prog);

  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  var loc = gl.getAttribLocation(prog, 'a');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  var uRes = gl.getUniformLocation(prog, 'uRes');
  var uPhase = gl.getUniformLocation(prog, 'uPhase');

  function resize(){
    var dpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);
    var w = Math.max(1, Math.round(canvas.clientWidth * dpr));
    var h = Math.max(1, Math.round(canvas.clientHeight * dpr));
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    gl.viewport(0, 0, w, h);
    gl.uniform2f(uRes, w, h);
  }
  function draw(ms){
    gl.uniform1f(uPhase, (ms % LOOP_MS) / LOOP_MS * 2 * Math.PI);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  function loop(now){ draw(now); requestAnimationFrame(loop); }

  window.addEventListener('resize', function(){ resize(); if (reduce) draw(STILL_MS); });
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var STILL_MS = LOOP_MS * 0.8;   // a flattering still frame
  resize();
  if (reduce) draw(STILL_MS); else requestAnimationFrame(loop);
})();
</script>
</body>
</html>
