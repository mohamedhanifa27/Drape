<title>drape — intro animation</title>
<style>
  :root { --cream:#FBFAF5; --ink:#111111; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { background:var(--ink); color:var(--cream); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }

  /* ---- the page that sits underneath the intro (replace with your store) ---- */
  .site { position:fixed; inset:0; }
  .site-nav { display:flex; align-items:center; padding:20px 28px; }
  .site-nav svg { height:34px; width:auto; fill:var(--cream); }
  .replay { position:fixed; right:20px; bottom:20px; font:inherit; font-size:14px; color:var(--cream);
            background:transparent; border:1px solid rgba(251,250,245,.4); border-radius:999px; padding:9px 16px; cursor:pointer; }
  .replay:hover { border-color:var(--cream); }
  .replay:focus-visible { outline:2px solid var(--cream); outline-offset:3px; }

  /* ---- intro overlay ---- */
  #drape-intro { position:fixed; inset:0; z-index:9999; background:var(--cream); display:grid; place-items:center; }
  #drape-intro[hidden] { display:none; }
  .intro-logo { width:min(70vw,720px); height:auto; overflow:visible; fill:var(--ink); will-change:transform; }
  .intro-logo path { transform-box:fill-box; transform-origin:50% 0%; opacity:0; }

  /* letters fall like cloth, with a little rebound */
  #drape-intro.play .drop { animation:drop 1.15s cubic-bezier(.3,.7,.3,1) both; animation-delay:calc(var(--i) * 90ms + 250ms); }
  /* the swoosh of the d rises from below to meet the falling d */
  #drape-intro.play .rise { animation:rise 1.05s cubic-bezier(.25,.8,.25,1) both; animation-delay:120ms; transform-origin:50% 100%; }
  #drape-intro.play .d-top { animation:dtop 1.05s cubic-bezier(.3,.7,.3,1) both; animation-delay:0ms; }

  @keyframes drop {
    0%   { opacity:0; transform:translateY(-130px) skewX(7deg) scaleY(1.18); }
    35%  { opacity:1; }
    62%  { opacity:1; transform:translateY(9px) skewX(-2.5deg) scaleY(.97); }
    82%  { opacity:1; transform:translateY(-3px) skewX(.8deg) scaleY(1.005); }
    100% { opacity:1; transform:none; }
  }
  @keyframes dtop {
    0%   { opacity:0; transform:translate(14px,-110px) rotate(-4deg); }
    35%  { opacity:1; }
    65%  { opacity:1; transform:translate(0,7px) rotate(.8deg); }
    100% { opacity:1; transform:none; }
  }
  @keyframes rise {
    0%   { opacity:0; transform:translate(-46px,90px) rotate(-6deg); }
    40%  { opacity:1; }
    100% { opacity:1; transform:none; }
  }

  /* the whole mark drifts up slightly while the cream cloth lifts */
  #drape-intro.lift .intro-logo { transition:transform 1s cubic-bezier(.65,0,.35,1); transform:translateY(-6vh); }

  @media (prefers-reduced-motion: reduce) {
    #drape-intro.play .drop, #drape-intro.play .rise, #drape-intro.play .d-top { animation:none; opacity:1; }
    .intro-logo path { opacity:1; }
    #drape-intro.lift .intro-logo { transition:none; transform:none; }
  }
</style>

<script>
(function () {
  var el = document.getElementById('drape-intro');
  var btn = document.getElementById('replay');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Timeline (ms): letters land ≈1900, hold, cloth lifts HOLD → HOLD+LIFT
  var HOLD = 2350, LIFT = 1100, N = 28, SPREAD = 0.4, AMP = 14;
  var raf, timer;

  function ease(x) { return x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2; }
  function clamp(x) { return Math.max(0, Math.min(1, x)); }

  // Bottom edge of the cream cloth: gathers up from the centre, edges lag behind.
  function clip(p) {
    var pts = ['0% 0%', '100% 0%'];
    for (var i = N; i >= 0; i--) {
      var x = i / N, d = Math.abs(x - .5) * 2;
      var e = ease(clamp(p * (1 + SPREAD) - SPREAD * d));
      var y = (100 + AMP) * (1 - e) - AMP;
      pts.push((x * 100).toFixed(2) + '% ' + y.toFixed(2) + '%');
    }
    el.style.clipPath = 'polygon(' + pts.join(',') + ')';
  }

  function finish() {
    el.hidden = true;
    el.style.clipPath = '';
    el.classList.remove('play', 'lift');
    document.dispatchEvent(new CustomEvent('drape:intro-done'));
  }

  function play() {
    cancelAnimationFrame(raf); clearTimeout(timer);
    el.hidden = false;
    el.classList.remove('play', 'lift');
    el.style.clipPath = '';
    void el.offsetWidth;                       // restart CSS animations
    el.classList.add('play');

    if (reduce) { timer = setTimeout(function () { el.style.transition = 'opacity .4s'; el.style.opacity = 0;
                    setTimeout(function () { el.style.opacity = ''; el.style.transition = ''; finish(); }, 420); }, 900); return; }

    timer = setTimeout(function () {
      el.classList.add('lift');
      var t0 = performance.now();
      (function step(now) {
        var p = clamp((now - t0) / LIFT);
        clip(p);
        if (p < 1) raf = requestAnimationFrame(step); else finish();
      })(t0);
    }, HOLD);
  }

  btn.addEventListener('click', play);
  window.drapeIntro = { play: play };
  play();
})();
</script>
